<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>防暈車視覺輔助</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a; /* 深色模式背景，減少刺眼 */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        #start-btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            background-color: #0A84FF;
            color: white;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }

        #dots-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
    </style>
</head>
<body>

    <button id="start-btn">啟用防暈車模式</button>

    <div id="dots-container"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('dots-container');
        const dots = [];

        // 隨機在螢幕兩側邊緣生成 40 個視覺點
        for (let i = 0; i < 40; i++) {
            let dot = document.createElement('div');
            dot.className = 'dot';
            // 分佈於左右各 15% 的區域內
            let isLeft = Math.random() > 0.5;
            dot.style.left = isLeft ? (Math.random() * 15) + 'vw' : (85 + Math.random() * 15) + 'vw';
            dot.style.top = Math.random() * 100 + 'vh';
            container.appendChild(dot);
            dots.push(dot);
        }

        startBtn.addEventListener('click', async () => {
            // iOS 13+ 需要使用者明確點擊並授權 DeviceMotion 權限
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        startTracking();
                    } else {
                        alert('需要允許動作感測器權限，才能追蹤車輛移動喔！');
                    }
                } catch (error) {
                    console.error('授權失敗:', error);
                }
            } else {
                // 非 iOS 13+ 裝置直接啟用
                startTracking();
            }
        });

        function startTracking() {
            startBtn.style.display = 'none';

            window.addEventListener('devicemotion', (event) => {
                // 取得 X 和 Y 軸的加速度 (不含重力影響)，若 acceleration 為 null 則使用 0
                let acc = event.acceleration;
                let accX = (acc && acc.x) ? acc.x : 0;
                let accY = (acc && acc.y) ? acc.y : 0;

                // 將加速度轉換為螢幕上的像素位移 (數值可依實機測試感受調整)
                // 加入最大/最小限制，避免點點飛出螢幕
                let moveX = Math.max(-60, Math.min(60, accX * -8));
                let moveY = Math.max(-60, Math.min(60, accY * 8));

                // 即時更新所有點點的 transform 屬性
                requestAnimationFrame(() => {
                    dots.forEach(dot => {
                        dot.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });
                });
            });
        }
    </script>
</body>
</html>
