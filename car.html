<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>防暈車視覺輔助</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        #start-btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            background-color: #0A84FF;
            color: white;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }

        #dots-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <button id="start-btn">啟用防暈車模式</button>

    <div id="dots-container"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const container = document.getElementById('dots-container');

        const DOT_SIZE_MIN = 6;   // px
        const DOT_SIZE_MAX = 24;  // px
        const DOT_SIZE_DEFAULT = 12; // px
        const SPACING = 60;       // 等距間距 px
        const SIDE_X_LEFT = 0.07; // 左側 X 位置（螢幕寬度比例）
        const SIDE_X_RIGHT = 0.93; // 右側 X 位置
        const DRIFT_SPEED = 0.3;  // 每幀漂移速度係數

        let dots = [];
        let rotRate = { alpha: 0, beta: 0, gamma: 0 };
        let animFrameId = null;

        function createDots() {
            container.innerHTML = '';
            dots = [];

            const screenH = window.innerHeight;
            const screenW = window.innerWidth;
            const count = Math.floor(screenH / SPACING) + 1;

            for (let side = 0; side < 2; side++) {
                const xRatio = side === 0 ? SIDE_X_LEFT : SIDE_X_RIGHT;
                const xPx = screenW * xRatio;

                for (let i = 0; i < count; i++) {
                    const yPx = i * SPACING;

                    const dot = document.createElement('div');
                    dot.className = 'dot';

                    const dotData = {
                        el: dot,
                        originX: xPx,
                        originY: yPx,
                        x: xPx,
                        y: yPx,
                        size: DOT_SIZE_DEFAULT
                    };

                    dot.style.left = xPx + 'px';
                    dot.style.top = yPx + 'px';
                    dot.style.width = DOT_SIZE_DEFAULT + 'px';
                    dot.style.height = DOT_SIZE_DEFAULT + 'px';
                    dot.style.transform = 'translate(-50%, -50%)';

                    container.appendChild(dot);
                    dots.push(dotData);
                }
            }
        }

        createDots();
        window.addEventListener('resize', createDots);

        startBtn.addEventListener('click', async () => {
            const needsMotionPerm = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
            const needsOrientPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';

            try {
                if (needsMotionPerm) {
                    const perm = await DeviceMotionEvent.requestPermission();
                    if (perm !== 'granted') {
                        alert('需要允許動作感測器權限，才能追蹤車輛移動喔！');
                        return;
                    }
                }
                if (needsOrientPerm) {
                    const perm2 = await DeviceOrientationEvent.requestPermission();
                    if (perm2 !== 'granted') {
                        alert('需要允許方向感測器權限，才能追蹤旋轉速率喔！');
                        return;
                    }
                }
            } catch (error) {
                console.error('授權失敗:', error);
                return;
            }

            startTracking();
        });

        function startTracking() {
            startBtn.style.display = 'none';

            window.addEventListener('devicemotion', (event) => {
                const rr = event.rotationRate;
                rotRate.alpha = (rr && rr.alpha) ? rr.alpha : 0;
                rotRate.beta  = (rr && rr.beta)  ? rr.beta  : 0;
                rotRate.gamma = (rr && rr.gamma)  ? rr.gamma : 0;
            });

            function animate() {
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;

                // 旋轉速率合力（用於決定圓點大小）
                const rotSpeed = Math.sqrt(
                    rotRate.alpha * rotRate.alpha +
                    rotRate.beta  * rotRate.beta  +
                    rotRate.gamma * rotRate.gamma
                );

                // 映射到 6px ~ 24px，最大速度設定為 200 deg/s
                const maxRotSpeed = 200;
                const t = Math.min(rotSpeed / maxRotSpeed, 1);
                const newSize = DOT_SIZE_MIN + t * (DOT_SIZE_MAX - DOT_SIZE_MIN);

                // 漂移方向：beta（前後傾斜）→ Y，gamma（左右傾斜）→ X
                const driftX = rotRate.gamma * DRIFT_SPEED;
                const driftY = rotRate.beta  * DRIFT_SPEED;

                dots.forEach(d => {
                    // 累積漂移
                    d.x += driftX;
                    d.y += driftY;

                    // 卷回（wrap around）
                    if (d.x < -newSize) d.x = screenW + newSize;
                    if (d.x > screenW + newSize) d.x = -newSize;
                    if (d.y < -newSize) d.y = screenH + newSize;
                    if (d.y > screenH + newSize) d.y = -newSize;

                    // 更新尺寸
                    d.size = newSize;
                    d.el.style.width  = newSize + 'px';
                    d.el.style.height = newSize + 'px';
                    d.el.style.left   = d.x + 'px';
                    d.el.style.top    = d.y + 'px';
                });

                animFrameId = requestAnimationFrame(animate);
            }

            animFrameId = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
